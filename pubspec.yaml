name: oxide_film
description: "Cross-platform media parser for movies, series, cartoons & anime"
publish_to: 'none'
version: 1.0.20260201+20260201

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
  flutter_vector_icons: ^2.0.0

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^15.0.0

  # Network
  dio: ^5.8.0
  dio_smart_retry: ^7.0.1
  connectivity_plus: ^6.1.2

  # HTML Parsing & Scraping
  html: ^0.15.6
  beautiful_soup_dart: ^0.3.0

  # Video Player (cross-platform)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  # Platform-specific libs
  media_kit_libs_android_video: ^1.3.6
  media_kit_libs_windows_video: ^1.0.9
  media_kit_libs_linux: ^1.1.3

  # Local Database
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28

  # DI
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Utils
  json_annotation: ^4.9.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  intl: ^0.20.2
  file_picker: ^8.1.7

  # Desktop window management (custom titlebar)
  window_manager: ^0.4.3

  # WebView for Cloudflare bypass (headless cookie extraction)
  flutter_inappwebview: ^6.1.5

  # Better HTML parsing
  universal_html: ^2.2.4

  # TMDB API
  tmdb_api: ^2.1.7
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code generation
  build_runner: ^2.4.14
  json_serializable: ^6.9.2
  injectable_generator: ^2.7.0
  drift_dev: ^2.22.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
